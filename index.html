<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>嘘つきギツネの交渉航路</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 対峙構図 — 一行（左）と交渉相手（右）が舞台で向き合い、下にRPGのコマンド窓と羊皮紙の会話窓。単一のダーク世界観。 */
:root{
  color-scheme: dark;
  --void:#0c0e18;        /* 宇宙の底 */
  --hull:#171b2b;        /* 船体パネル */
  --hull-2:#222840;
  --brass:#c9a25a;       /* 真鍮の縁 */
  --brass-dim:#7d6436;
  --parch:#efe3c6;       /* 会話窓の羊皮紙 */
  --parch-2:#e2d2ae;
  --ink:#2a1d14;         /* 墨 */
  --ink-soft:#6b5640;
  --ember:#e4743c;       /* 狐火のアクセント */
  --teal:#6fd0c8;        /* AI猫のUI光 */
  --truth:#c43d2c;
  --lie:#3867c9;
  --fg:#e9e3d3;
  --fg-dim:#9a95a8;
  --f-ui:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP",monospace;
  --f-text:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --f-disp:"Yuji Syuku","Hiragino Mincho ProN","Noto Serif JP",serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--void);color:var(--fg);font-family:var(--f-text);overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#app{position:relative;height:100%;max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- TITLE ---------- */
#title{position:relative;border:1px solid var(--brass-dim);border-radius:6px;overflow:hidden;background:radial-gradient(120% 90% at 70% 110%,#3a1f1a 0%,#171b2b 45%,#0c0e18 100%)}
#title canvas{position:absolute;inset:0;width:100%;height:100%}
.t-wrap{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;gap:12px;padding:24px 28px}
.t-eyebrow{font-family:var(--f-ui);color:var(--teal);letter-spacing:.2em;font-size:.8rem}
.t-logo{font-family:var(--f-disp);font-size:clamp(2.1rem,6vw,4.4rem);line-height:1.08;margin:.3em 0 .2em;color:var(--parch);text-shadow:0 0 18px rgba(228,116,60,.35);text-wrap:balance}
.t-logo em{font-style:normal;color:var(--ember)}
.t-sub{font-family:var(--f-ui);color:var(--brass);font-size:1rem;letter-spacing:.08em}
.t-lede{max-width:34em;color:var(--fg-dim);line-height:1.8;font-size:.92rem;margin:1em 0 1.4em}
.t-menu{display:flex;flex-direction:column;gap:6px;width:min(280px,100%)}
.t-menu button{font-family:var(--f-ui);text-align:left;background:rgba(12,14,24,.7);border:1px solid var(--brass-dim);padding:.7em 1em;cursor:pointer;letter-spacing:.08em;font-size:1rem}
.t-menu button:hover,.t-menu button:focus-visible{border-color:var(--ember);color:var(--ember)}
.t-menu button::before{content:"▶ ";color:transparent}
.t-menu button:hover::before,.t-menu button:focus-visible::before{color:var(--ember)}
.t-prog{font-family:var(--f-ui);font-size:.78rem;color:var(--fg-dim);margin-top:12px;letter-spacing:.05em}
.t-art{height:min(64vh,520px);display:flex;align-items:flex-end;justify-content:center;gap:4px;align-self:end}
.t-art img{display:block;width:auto;filter:drop-shadow(0 6px 20px rgba(0,0,0,.6));flex:none}
.t-art .g{height:70%}
.t-art .c{height:27%;margin-left:-18px;position:relative;z-index:2}
.t-art .m{height:94%}
.t-art .r{height:92%}

/* ---------- GAME ---------- */
#game{gap:8px}
.hud{display:flex;align-items:center;gap:14px;font-family:var(--f-ui);font-size:.86rem;padding:6px 10px;background:var(--hull);border:1px solid var(--brass-dim);border-radius:4px}
.hud .loc{color:var(--brass);white-space:nowrap}
.hud .loc b{color:var(--parch);font-weight:400;margin-left:.4em}
.clock{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.clock .lbl{color:var(--fg-dim);white-space:nowrap}
.clock .num{font-variant-numeric:tabular-nums;color:var(--parch);white-space:nowrap}
.clock.warn .num{color:var(--ember)}
.pips{flex:1;min-width:40px;display:grid;grid-template-columns:repeat(48,1fr);gap:1px;height:10px}
.pips i{background:var(--ember);opacity:.9;border-radius:1px;transition:background .4s,opacity .4s}
.pips i.gone{background:#3a3f55;opacity:.5}
.cr{font-variant-numeric:tabular-nums;color:var(--parch);white-space:nowrap}
.cr small{color:var(--brass)}
.hbtn{background:none;border:1px solid var(--brass-dim);color:var(--brass);width:30px;height:28px;border-radius:3px;cursor:pointer;font-family:var(--f-ui);position:relative}
.hbtn:hover{color:var(--ember);border-color:var(--ember)}
.hbtn .dot{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--ember);display:none}
.hbtn.has .dot{display:block}

.stage{position:relative;flex:1;min-height:220px;border:1px solid var(--brass-dim);border-radius:4px;overflow:hidden;background:#0d1120}
.stage .bg{position:absolute;inset:0}
.stage .bg svg{width:100%;height:100%;display:block}
.actors{position:absolute;inset:0;pointer-events:none}
.actor{position:absolute;bottom:3%;transition:filter .25s,transform .25s,opacity .4s;transform-origin:bottom center}
.actor img,.actor svg{height:100%;width:auto;display:block}
.actor svg{aspect-ratio:1/2}
.a-npc.belta{height:80%}
.a-npc.belta svg{aspect-ratio:4/9}
.reye{animation:reye 4s infinite}@keyframes reye{94%{opacity:1}96%{opacity:0}98%{opacity:1}}
.actor.dim{filter:brightness(.55) saturate(.7)}
.actor.speak{transform:translateY(-6px) scale(1.02);filter:drop-shadow(0 0 10px rgba(239,227,198,.25))}
.a-girl{right:39%;height:72%}
.a-mech{right:18%;height:87%}
.a-cat{right:32.5%;height:30%}
.a-ritsu{right:2%;height:85%}
.a-npc{left:5%;height:80%}
.a-belta{height:76%}.a-zaid{height:82%}.a-m7{height:70%}
.a-npc.panel{height:74%;bottom:6%}
.a-npc.panel img{border:4px solid var(--parch);box-shadow:0 0 0 2px var(--ink),0 12px 30px rgba(0,0,0,.6);transform:rotate(2deg)}
.shadow{position:absolute;bottom:2%;height:3%;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(4px)}
.actor .tailbob{animation:none}
.idle{animation:idle 3.6s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-2px)}}

.toast-zone{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:5;pointer-events:none;max-width:70%}
.toast{font-family:var(--f-ui);font-size:.82rem;background:var(--parch);color:var(--ink);padding:.45em .8em .45em .6em;border-left:4px solid var(--ember);box-shadow:0 4px 12px rgba(0,0,0,.4);animation:tin .35s ease-out, tout .5s ease-in 2.8s forwards}
.toast b{color:var(--ember);font-weight:400;margin-right:.4em}
@keyframes tin{from{transform:translateX(-20px);opacity:0}}
@keyframes tout{to{transform:translateY(-6px);opacity:0}}

.route-banner{position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,rgba(12,14,24,0),rgba(12,14,24,.92) 18%,rgba(12,14,24,.92) 82%,rgba(12,14,24,0));padding:14px 60px;pointer-events:none;animation:bin .5s cubic-bezier(.2,1.4,.4,1), bout .6s ease-in 3.2s forwards;white-space:nowrap}
.route-banner .mini{width:44px;height:62px;border-radius:4px;background:var(--parch);border:2px solid var(--brass);display:grid;place-items:center;animation:flip .7s ease-out}
.route-banner .mini svg{width:30px}
.route-banner .t1{font-family:var(--f-ui);color:var(--ember);font-size:.8rem;letter-spacing:.2em}
.route-banner .t2{font-family:var(--f-text);font-weight:700;color:var(--parch);font-size:1.05rem}
@keyframes bin{from{transform:translate(-50%,-20px);opacity:0}}
@keyframes bout{to{opacity:0}}
@keyframes flip{from{transform:rotateY(180deg)}}

.bottom{display:grid;grid-template-columns:230px minmax(0,1fr);gap:8px;height:196px}
.cmd{position:relative;background:var(--hull);border:2px solid var(--brass-dim);border-radius:4px;padding:10px 8px;font-family:var(--f-ui);overflow:auto;box-shadow:inset 0 0 0 1px #0a0c14}
.cmd::before,.cmd::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--brass-dim);top:4px}
.cmd::before{left:4px}.cmd::after{right:4px}
.cmd .mt{font-size:.74rem;color:var(--brass);letter-spacing:.14em;padding:0 8px 6px;border-bottom:1px dashed var(--brass-dim);margin-bottom:6px;display:flex;justify-content:space-between;gap:6px}
.cmd ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.cmd li button{width:100%;text-align:left;background:none;border:0;padding:.42em .5em .42em 1.4em;cursor:pointer;position:relative;font-size:.95rem;display:flex;gap:6px;align-items:baseline;line-height:1.3}
.cmd li button .lab{flex:1;min-width:0}
.cmd li button .cost{font-size:.72rem;color:var(--fg-dim);white-space:nowrap}
.cmd li button .new{font-size:.62rem;color:var(--void);background:var(--ember);padding:0 .35em;border-radius:2px;letter-spacing:.05em}
.cmd li button.done .lab{color:var(--fg-dim)}
.cmd li button[disabled]{opacity:.38;cursor:default}
.cmd li button.sel::before{content:"▶";position:absolute;left:.3em;color:var(--ember);animation:blink 1s steps(2) infinite}
.cmd li button:hover:not([disabled]){background:rgba(201,162,90,.1)}
.cmd.busy ul{opacity:.25;pointer-events:none}
.cmd .hintline{font-size:.72rem;color:var(--fg-dim);padding:6px 8px 0;line-height:1.5}
@keyframes blink{50%{opacity:.3}}

.msg{position:relative;background:var(--parch);color:var(--ink);border-radius:4px;border:2px solid var(--brass);box-shadow:inset 0 0 0 3px var(--parch),inset 0 0 0 4px var(--brass-dim),0 6px 18px rgba(0,0,0,.35);display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:14px 18px;cursor:pointer;overflow:hidden;background-image:radial-gradient(120% 140% at 0% 0%,rgba(255,255,255,.35),transparent 55%),radial-gradient(90% 120% at 100% 100%,rgba(122,86,44,.16),transparent 60%)}
.face{width:128px;height:128px;border:2px solid var(--ink);border-radius:3px;overflow:hidden;background:var(--parch-2);align-self:start;position:relative}
.face img,.face svg{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}
.face.none{display:none}
.msg .body{min-width:0;display:flex;flex-direction:column;overflow:auto}
.name{font-family:var(--f-ui);font-size:.82rem;letter-spacing:.14em;color:var(--parch);background:var(--ink);align-self:flex-start;padding:.15em .7em;margin-bottom:.45em;border-radius:2px}
.name.n-ritsu{background:#8a4a22}.name.n-cat{background:#1f3b44}.name.n-girl{background:#6b4a2b}.name.n-mech{background:#3a3a40}
.name.n-npc{background:#5a2f38}
.text{font-size:1.06rem;line-height:1.75;font-weight:500;white-space:pre-wrap}
.text.narr{font-style:normal;color:var(--ink-soft);font-weight:400}
.text.sys{font-family:var(--f-ui);color:#7b3a16;font-size:.95rem}
.adv{position:absolute;right:14px;bottom:8px;color:var(--ember);font-size:.8rem;animation:blink .8s steps(2) infinite}
.stamp{position:absolute;right:22px;top:12px;font-family:var(--f-ui);font-size:.95rem;padding:.2em .6em;border:3px double currentColor;border-radius:4px;transform:rotate(-8deg);opacity:.88;letter-spacing:.1em;animation:stamp .35s cubic-bezier(.3,1.8,.5,1)}
.stamp small{display:block;font-size:.58rem;letter-spacing:.2em;opacity:.8}
.stamp.T{color:var(--truth)}.stamp.F{color:var(--lie)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.2);opacity:0}}
.offer-card{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem;margin-top:.3em}
.offer-card dt{font-family:var(--f-ui);color:var(--ink-soft);font-size:.8rem}
.offer-card dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.offer-card dd.bad{color:var(--truth)}
.offer-title{font-weight:700;font-size:1.1rem}

/* roll */
.roll{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(8,9,16,.72)}
.roll .box{background:var(--hull);border:2px solid var(--brass);padding:18px 26px;text-align:center;font-family:var(--f-ui)}
.roll .box p{margin:.4em 0;color:var(--parch)}
.roll canvas{width:240px;height:150px;display:block;margin:6px auto}
.roll .res{font-size:1.3rem;letter-spacing:.2em;min-height:1.4em}

/* overlays */
.overlay{position:absolute;inset:0;z-index:20;background:rgba(8,9,16,.86);display:flex;align-items:stretch;justify-content:center;padding:14px}
.sheet{position:relative;width:min(920px,100%);background:var(--parch);color:var(--ink);border:2px solid var(--brass);border-radius:4px;display:flex;flex-direction:column;min-height:0;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.sheet header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--parch-2)}
.sheet header h2{font-family:var(--f-disp);font-weight:400;font-size:1.5rem;margin:0;flex:1}
.sheet .x{background:var(--ink);color:var(--parch);border:0;padding:.3em .8em;cursor:pointer;font-family:var(--f-ui)}
.sheet .scroll{overflow:auto;padding:16px 20px 22px;min-height:0;flex:1}
.tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--parch-2);flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:.6em .8em;cursor:pointer;font-family:var(--f-ui);color:var(--ink-soft)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ember)}
.nb-list{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.nb-list li{background:#fff8e6;border:1px solid var(--parch-2);padding:.35em .7em;font-size:.9rem;border-radius:2px}
.nb-h{font-family:var(--f-ui);color:var(--ink-soft);font-size:.8rem;letter-spacing:.14em;margin:1.2em 0 .5em}
.nb-h:first-child{margin-top:0}
.routes{display:grid;gap:6px}
.routes div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--parch-2);padding:.3em 0;font-size:.92rem}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.fcard{aspect-ratio:5/7;max-width:100%;border-radius:6px;background:linear-gradient(160deg,#20263d,#141828);border:2px solid var(--brass);color:var(--parch);display:flex;flex-direction:column;padding:8px;position:relative;overflow:hidden}
.fcard .no{font-family:var(--f-ui);font-size:.66rem;color:var(--brass);letter-spacing:.1em}
.fcard .art{flex:1;display:grid;place-items:center}
.fcard .art svg{width:62%;max-height:100%}
.fcard .nm{font-weight:700;font-size:.86rem;text-align:center;line-height:1.3}
.fcard .fl{font-size:.68rem;color:var(--fg-dim);text-align:center;line-height:1.45;margin-top:3px}
.fcard.lock{background:repeating-linear-gradient(45deg,#1a1e2e 0 8px,#161a28 8px 16px);border-color:#4a4a55}
.fcard.lock .nm{color:#6c6c7a}
.fcard.newc::after{content:"NEW";position:absolute;top:6px;right:-18px;background:var(--ember);color:var(--void);font-family:var(--f-ui);font-size:.6rem;padding:1px 22px;transform:rotate(35deg)}
.titles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ttl{border:1px solid var(--ink);padding:.6em .8em;background:#fff8e6}
.ttl b{display:block;font-family:var(--f-disp);font-weight:400;font-size:1.15rem}
.ttl span{font-size:.8rem;color:var(--ink-soft)}
.ttl.lock{opacity:.45;border-style:dashed;background:none}
.sp-list{display:grid;gap:8px}
.sp-item{border:1px solid var(--parch-2);background:#fff8e6;padding:.6em .8em}
.sp-item summary{cursor:pointer;font-weight:700}
.sp-item .ln{font-size:.9rem;line-height:1.7;margin:.2em 0}
.sp-item .ln b{font-family:var(--f-ui);font-weight:400;color:var(--ink-soft);margin-right:.5em}
.sp-item.lock{opacity:.45}

/* ending */
#ending .sheet{margin:0 auto}
.end-hero{padding:18px 22px 6px;text-align:center;border-bottom:1px dashed var(--ink-soft)}
.end-eyebrow{font-family:var(--f-ui);letter-spacing:.24em;color:var(--ink-soft);font-size:.78rem}
.end-title{font-family:var(--f-disp);font-size:clamp(2rem,5vw,3.2rem);margin:.15em 0;text-wrap:balance;line-height:1.15}
.end-stamps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0 10px}
.estamp{border:2px solid var(--ink);padding:.4em .3em;text-align:center}
.estamp dt{font-family:var(--f-ui);font-size:.68rem;color:var(--ink-soft);letter-spacing:.12em}
.estamp dd{margin:.1em 0 0;font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem}
.end-body{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:18px;padding:16px 22px}
.voices{display:grid;gap:10px;align-content:start}
.voice{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center}
.voice .f{width:44px;height:44px;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden;background:var(--parch-2)}
.voice .f img,.voice .f svg{width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.voice p{margin:0;font-size:.95rem;line-height:1.55}
.voice p b{font-family:var(--f-ui);font-weight:400;color:var(--ink-soft);font-size:.72rem;display:block}
.got{display:flex;flex-direction:column;gap:10px;align-items:center}
.got .lbl{font-family:var(--f-ui);font-size:.72rem;letter-spacing:.16em;color:var(--ink-soft)}
.got .fcard{width:150px}
.got .ttl{width:100%;text-align:center}
.notes{padding:4px 22px 18px}
.notes h3{font-family:var(--f-ui);font-weight:400;letter-spacing:.24em;font-size:.9rem;color:var(--ember);margin:.4em 0 .6em;display:flex;align-items:center;gap:10px}
.notes h3::after{content:"";flex:1;border-bottom:1px solid var(--ink-soft);opacity:.4}
.note{border-left:3px solid var(--ember);padding:.4em .9em .5em;margin-bottom:10px;background:#fff8e6}
.note .did{font-size:.82rem;color:var(--ink-soft)}
.note .term{font-weight:700;font-size:1.02rem;margin:.1em 0}
.note p{margin:.2em 0 0;font-size:.9rem;line-height:1.75;max-width:62em}
.note.lock{border-left-color:#b9ab8c;background:none;color:var(--ink-soft)}
.end-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:6px 22px 20px}
.end-actions button{font-family:var(--f-ui);background:var(--ink);color:var(--parch);border:0;padding:.7em 1.3em;cursor:pointer;letter-spacing:.08em}
.end-actions button.alt{background:none;color:var(--ink);border:1px solid var(--ink)}
.end-actions button:hover{background:var(--ember);color:var(--void)}
.remain{text-align:center;font-family:var(--f-ui);font-size:.8rem;color:var(--ink-soft);padding-bottom:6px}

@media (max-width:760px){
  #app{padding-inline:8px;padding-block:6px}
  .hud{gap:8px;font-size:.76rem;flex-wrap:wrap}
  .clock{order:3;flex-basis:100%}
  .clock .lbl{display:none}
  .stage{flex:none;height:40vh;min-height:220px}
  .bottom{flex:1;min-height:0}
  .a-girl{right:62%;height:62%}.a-mech{right:28%;height:72%}.a-cat{right:51%;height:26%}.a-ritsu{right:0;height:74%}.a-npc{left:-3%;height:70%}.a-m7{height:60%}
  .a-npc.panel{height:60%}
  .bottom{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto}
  .msg{order:1;min-height:132px;max-height:40vh;grid-template-columns:auto minmax(0,1fr);padding:10px 12px;gap:10px}

let S, SAVE, busy=false;
function freshState(){return {t:2,money:24000,loc:'belta',topics:new Set(['quote','deadline']),flags:{},asked:new Set(),looked:new Set(),cnt:{},visited:new Set(['belta']),offersSeen:new Set(['A']),qCount:0,tried:new Set(),specials:new Set(),newCards:[],end:null,warned:false}}
function loadSave(){try{const d=JSON.parse(localStorage.getItem('kitsune_w01')||'{}');return {cards:d.cards||[],titles:d.titles||[],specials:d.specials||[],endings:d.endings||[],notes:d.notes||[]}}catch(e){return {cards:[],titles:[],specials:[],endings:[],notes:[]}}}
function persist(){try{localStorage.setItem('kitsune_w01',JSON.stringify(SAVE))}catch(e){}}
function addUniq(arr,v){if(!arr.includes(v)){arr.push(v);return true}return false}
const has=k=>S.topics.has(k);
function fmtH(h){const hh=Math.floor(h),mm=Math.round((h-hh)*60);return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')}
function yen(n){return n.toLocaleString('ja-JP')}

/* ============ AUDIO ============ */
let AC=null,sound=true;
function beep(f=880,d=.04,type='square',v=.03){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function jingle(){[660,880,1320].forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.05),i*90))}

/* ============ DOM ============ */
const $=id=>document.getElementById(id);
function show(id){['title','game'].forEach(s=>$(s).hidden=s!==id)}

function renderHUD(){
  const left=Math.max(0,48-S.t);
  $('hudLoc').textContent=LOCS[S.loc].name;
  $('hudTime').textContent=fmtH(left);
  $('clock').classList.toggle('warn',left<=10);
  const p=$('pips');if(!p.children.length){for(let i=0;i<48;i++)p.appendChild(document.createElement('i'))}
  [...p.children].forEach((el,i)=>el.classList.toggle('gone',i<Math.floor(S.t)));
  $('hudCr').innerHTML=yen(S.money)+' <small>Cr</small>';
}
function renderStage(){
  $('bg').innerHTML=BG[LOCS[S.loc].bg]();
  const a=$('actors');a.innerHTML='';
  const mk=(cls,html)=>{const d=document.createElement('div');d.className='actor '+cls;d.innerHTML=html;a.appendChild(d);return d};
  mk('a-girl','<img src="'+IMG.sp_girl+'" alt="少女">').dataset.k='girl';
  mk('a-mech','<img src="'+IMG.sp_mech+'" alt="整備士">').dataset.k='mech';
  mk('a-cat idle','<img src="'+IMG.sp_cat+'" alt="AI猫">').dataset.k='cat';
  mk('a-ritsu','<img src="'+IMG.sp_ritsu+'" alt="リツ">').dataset.k='ritsu';
  const npc=LOCS[S.loc].npc;
  if(npc==='b')mk('a-npc a-belta','<img src="'+IMG.sp_belta+'" alt="ベルタ">').dataset.k='npc';
  if(npc==='k')mk('a-npc a-m7 idle','<img src="'+IMG.sp_m7+'" alt="M-7">').dataset.k='npc';
  if(npc==='z')mk('a-npc a-zaid','<img src="'+IMG.sp_zaid+'" alt="ザイード">').dataset.k='npc';
}
function setSpeaker(sp){
  const c=CH[sp];const key=c&&c.actor;
  document.querySelectorAll('.actor').forEach(el=>{
    el.classList.remove('speak','dim');
    if(!key)return;
    if(el.dataset.k===key)el.classList.add('speak');else el.classList.add('dim');
  });
  // ritsu pose swap
  const r=document.querySelector('.a-ritsu img');

let advResolve=null,typing=null;
function parse(l){const [head,text,stamp]=l.split('|');const [sp,fc]=head.split(':');return {sp,fc,text,stamp}}
function say(line){
  return new Promise(res=>{
    const L=parse(line),c=CH[L.sp]||{};
    const face=$('face'),name=$('name'),text=$('text');
    const old=$('msg').querySelector('.stamp');if(old)old.remove();
    if(c.narr||c.sys){face.className='face none';face.innerHTML='';name.hidden=true;clearSpeaker()}
    else{face.className='face';face.innerHTML=faceHTML(L.sp,L.fc);name.hidden=false;name.textContent=c.name;name.className='name '+c.cls;setSpeaker(L.sp);if(L.sp==='r')ritsuPose(L.fc||'smile')}
    text.className='text'+(c.narr?' narr':'')+(c.sys?' sys':'');
    text.textContent='';$('adv').hidden=true;
    let i=0;const full=L.text;
    const done=()=>{clearInterval(typing);typing=null;text.textContent=full;$('adv').hidden=false;
      if(L.stamp){const s=document.createElement('div');s.className='stamp '+L.stamp;s.innerHTML='<small>AI猫</small>'+(L.stamp==='T'?'真実判定':'虚偽判定');$('msg').appendChild(s);beep(L.stamp==='T'?520:300,.12,'sawtooth',.03)}
      advResolve=()=>{advResolve=null;res()}};
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){done();return}
    typing=setInterval(()=>{i++;text.textContent=full.slice(0,i);if(i%3===0&&!c.narr)beep(c.sys?600:(L.sp==='c'?1500:L.sp==='r'?700:900),.02,'square',.015);if(i>=full.length)done()},22);
    advResolve=()=>{done()};
  });
}

function rollDial(p,fake){return new Promise(res=>{
  const wrap=document.createElement('div');wrap.className='roll';wrap.innerHTML='<div class="box"><p>整備士の見立て：成功率 '+Math.round(p*100)+'%</p><canvas width="480" height="300"></canvas><div class="res"></div></div>';$('stage').appendChild(wrap);
  const cv=wrap.querySelector('canvas'),x=cv.getContext('2d');let zone=p,ang=Math.PI,target;
  const win=fake?false:Math.random()<p;
  // needle target within win/lose arc; arc from PI (left) to 2PI (right), success zone is left portion
  const pick=(a,b)=>a+(b-a)*(.15+Math.random()*.7);
  const draw=()=>{x.clearRect(0,0,480,300);x.lineWidth=34;
    x.strokeStyle='#3a3f55';x.beginPath();x.arc(240,260,180,Math.PI,2*Math.PI);x.stroke();
    x.strokeStyle='#e4743c';x.beginPath();x.arc(240,260,180,Math.PI,Math.PI+Math.PI*zone);x.stroke();
    x.fillStyle='#efe3c6';x.font='22px DotGothic16, monospace';x.textAlign='center';x.fillText('成功',240+Math.cos(Math.PI+Math.PI*zone/2)*120,260+Math.sin(Math.PI+Math.PI*zone/2)*120);
    x.strokeStyle='#efe3c6';x.lineWidth=6;x.beginPath();x.moveTo(240,260);x.lineTo(240+Math.cos(ang)*200,260+Math.sin(ang)*200);x.stroke();x.fillStyle='#c9a25a';x.beginPath();x.arc(240,260,14,0,7);x.fill()};
  draw();
  const go=()=>{
    const z=zone;target=win?Math.PI+Math.PI*pick(0,z):Math.PI+Math.PI*pick(z,1);
    const spins=3,start=performance.now(),from=Math.PI,dist=spins*2*Math.PI+(target-from),dur=2400;
    const step=now=>{const k=Math.min(1,(now-start)/dur),e=1-Math.pow(1-k,3);ang=from+dist*e;draw();if(Math.floor(k*30)%2===0)beep(400+k*600,.015,'square',.02);if(k<1)requestAnimationFrame(step);else{const r=wrap.querySelector('.res');r.textContent=win?'成功':'失敗';r.style.color=win?'#6fd0c8':'#e4743c';beep(win?1320:220,.3,'triangle',.06);setTimeout(()=>{wrap.remove();res(win)},1100)}};
    requestAnimationFrame(step)};
  if(fake){const p1=wrap.querySelector('p');setTimeout(()=>{p1.textContent='……刻印が一文字違う。本当の成功率 0%';const s0=performance.now();const sh=now=>{const k=Math.min(1,(now-s0)/700);zone=p*(1-k);draw();if(k<1)requestAnimationFrame(sh);else setTimeout(go,400)};requestAnimationFrame(sh)},900)}
  else setTimeout(go,700);
})}

  const tl=[...S.topics].map(k=>'<li>'+TOPICS[k]+'</li>').join('');
  const rt=availOffers().map(id=>{const o=OFFERS[id];return '<div><span>'+o.title+'</span><span>'+yen(o.price())+' Cr ・ '+o.dur+'h</span></div>'}).join('');
  ov.innerHTML='<div class="sheet"><header><h2>ききこみ帳</h2><button class="x" type="button" id="xNb">閉じる</button></header><div class="scroll"><div class="nb-h">わかったこと（'+S.topics.size+'）</div><ul class="nb-list">'+tl+'</ul><div class="nb-h">見つけた出航の方法（'+availOffers().length+'）</div><div class="routes">'+rt+'</div></div></div>';
  $('xNb').onclick=()=>{ov.hidden=true};
}
function openCollection(fromEnd){
  const ov=$('overlay');ov.hidden=false;ov.className='overlay';
  const tabs=['FOX CARD','称号','特殊会話','FOX NOTES'];let cur=0;
  const body=()=>{
    if(cur===0)return '<div class="cards">'+CARD_ORDER.map((id,i)=>SAVE.cards.includes(id)?'<div class="fcard"><div class="no">No.'+String(i+1).padStart(2,'0')+'</div><div class="art">'+SVG.fox()+'</div><div class="nm">'+CARDS[id].nm+'</div><div class="fl">'+CARDS[id].fl+'</div></div>':'<div class="fcard lock"><div class="no">No.'+String(i+1).padStart(2,'0')+'</div><div class="art"></div><div class="nm">？？？</div></div>').join('')+'</div>';
    if(cur===1)return '<div class="titles">'+Object.keys(TITLES).map(t=>SAVE.titles.includes(t)?'<div class="ttl"><b>'+t+'</b><span>'+TITLES[t]+'</span></div>':'<div class="ttl lock"><b>？？？</b><span>'+TITLES[t]+'</span></div>').join('')+'</div>';
    if(cur===2)return '<div class="sp-list">'+Object.keys(SPECIALS).map(k=>{const src=TALK.find(q=>q.special===k)||NEGO.find(q=>q.special===k)||LOOK.find(q=>q.special===k);if(!SAVE.specials.includes(k))return '<div class="sp-item lock">？？？</div>';const ls=(src.lines||[]).map(l=>{const L=parse(l);const c=CH[L.sp];return '<div class="ln"><b>'+(c.name||'')+'</b>'+L.text+'</div>'}).join('');return '<details class="sp-item"><summary>'+SPECIALS[k].nm+'</summary>'+ls+'</details>'}).join('')+'</div>';
    return NOTES.map(n=>SAVE.notes.includes(n.k)?'<div class="note"><div class="term">'+n.term+'</div><p>'+n.p+'</p></div>':'<div class="note lock"><div class="term">???</div><div class="did">'+n.hint+'</div></div>').join('');
  };
  const draw=()=>{ov.innerHTML='<div class="sheet"><header><h2>コレクション</h2><button class="x" type="button" id="xCo">閉じる</button></header><div class="tabs" role="tablist">'+tabs.map((t,i)=>'<button type="button" role="tab" aria-selected="'+(i===cur)+'" data-i="'+i+'">'+t+'</button>').join('')+'</div><div class="scroll">'+body()+'</div></div>';
    ov.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;draw()});
    $('xCo').onclick=()=>{if(fromEnd){renderEnding(ENDINGS[S.end],S.end,[ENDINGS[S.end].ttl],NOTES.filter(n=>n.test({end:S.end,flags:S.flags,cnt:S.cnt,topics:S.topics,offersSeen:S.offersSeen,tried:S.tried})))}else{ov.hidden=true}}};
  draw();
}

/* ============ FLOW ============ */
function toTitle(){show('title');const p=SAVE;$('tProg').textContent='FOX CARD '+p.cards.length+'/'+CARD_ORDER.length+'　称号 '+p.titles.length+'/'+Object.keys(TITLES).length+'　結末 '+p.endings.length+'/9';}
async function startGame(){
  S=freshState();menuStack=[];show('game');$('pips').innerHTML='';renderHUD();renderStage();$('cmd').innerHTML='';
  await play(OPENING);toRoot();afterAction();
}
$('btnStart').onclick=()=>{beep(880,.06);startGame()};
$('btnColl').onclick=()=>openCollection(false);
$('btnNote').onclick=()=>{if(!busy)openNotebook()};
$('btnSnd').onclick=()=>{sound=!sound;$('btnSnd').style.opacity=sound?1:.4};
document.addEventListener('keydown',e=>{
  if(!$('overlay').hidden){if(e.key==='Escape'){const x=$('overlay').querySelector('.x');if(x)x.click()}return}
  if($('game').hidden)return;
  if(advResolve&&(e.key==='Enter'||e.key===' ')){e.preventDefault();advance();return}
  if(busy)return;
  const btns=[...$('cmd').querySelectorAll('li button')];if(!btns.length)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();let i=selIdx;do{i=(i+(e.key==='ArrowDown'?1:-1)+btns.length)%btns.length}while(btns[i].disabled&&i!==selIdx);selIdx=i;btns.forEach((b,j)=>b.classList.toggle('sel',j===i))}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();btns[selIdx]&&btns[selIdx].click()}
  else if(e.key==='Escape'||e.key==='Backspace'){popMenu()}
});

/* title art & stars */
$('tArt').innerHTML='<img class="g" src="'+IMG.sp_girl+'" alt=""><img class="c" src="'+IMG.sp_cat+'" alt=""><img class="m" src="'+IMG.sp_mech+'" alt=""><img class="r" src="'+IMG.sp_ritsu+'" alt="狐の詐欺師リツ">';
(function(){const cv=$('stars'),x=cv.getContext('2d');let st=[];const rs=()=>{cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio;st=[...Array(160)].map(()=>({x:Math.random(),y:Math.random(),z:Math.random()*1.5+.3,p:Math.random()*6}))};rs();addEventListener('resize',rs);
const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
const f=t=>{if($('title').hidden){requestAnimationFrame(f);return}x.clearRect(0,0,cv.width,cv.height);st.forEach(s=>{const a=.35+.35*Math.sin(t/900+s.p);x.fillStyle='rgba(239,227,198,'+a+')';x.fillRect(s.x*cv.width,s.y*cv.height,s.z*devicePixelRatio,s.z*devicePixelRatio);if(!red){s.x-=s.z*.00006;if(s.x<0)s.x=1}});requestAnimationFrame(f)};requestAnimationFrame(f)})();
SAVE=loadSave();toTitle();
</script>
